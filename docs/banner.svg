<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-connectivity: network connectivity for Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b33"/>
      <stop offset="1" stop-color="#0c3a4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="phone">
      <rect x="820" y="70" width="320" height="440" rx="36"/>
    </clipPath>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="210" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-2">compose-connectivity</text>
    <text x="82" y="264" fill="#bae6fd" font-size="27" font-weight="500">Network status for Jetpack Compose, done right:</text>
    <text x="82" y="300" fill="#bae6fd" font-size="27" font-weight="500">StateFlow, debounce and an offline banner</text>
    <text x="82" y="362" fill="#7dd3fc" font-size="20" font-family="'JetBrains Mono', Menlo, monospace">val status by rememberConnectivityStatus()</text>

    <g font-size="18" font-weight="600" fill="#e0f2fe">
      <rect x="82" y="396" width="104" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="134" y="421" text-anchor="middle">Wi-Fi</text>
      <rect x="198" y="396" width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="257" y="421" text-anchor="middle">Cellular</text>
      <rect x="328" y="396" width="84" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="370" y="421" text-anchor="middle">VPN</text>
      <rect x="424" y="396" width="112" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="480" y="421" text-anchor="middle">Metered</text>
      <rect x="548" y="396" width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="607" y="421" text-anchor="middle">Validated</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="820" y="70" width="320" height="440" rx="36" fill="#f8fafc"/>
      <g clip-path="url(#phone)">
        <text x="850" y="130" fill="#0f172a" font-size="24" font-weight="700">Daily Brief</text>
        <rect x="820" y="156" width="320" height="46" fill="#1e293b"/>
        <circle cx="912" cy="179" r="5" fill="#f1f5f9"/>
        <text x="926" y="186" fill="#f1f5f9" font-size="17" font-weight="600">You're offline</text>
        <g fill="#ffffff" stroke="#e2e8f0">
          <rect x="850" y="222" width="260" height="76" rx="16"/>
          <rect x="850" y="310" width="260" height="76" rx="16"/>
          <rect x="850" y="398" width="260" height="76" rx="16" fill-opacity="0.5"/>
        </g>
        <text x="870" y="250" fill="#0369a1" font-size="12" font-weight="700">TECH DAILY</text>
        <text x="870" y="274" fill="#0f172a" font-size="16" font-weight="600">Stop the Wi-Fi flicker</text>
        <text x="870" y="338" fill="#0369a1" font-size="12" font-weight="700">THE COMMUTE</text>
        <text x="870" y="362" fill="#0f172a" font-size="16" font-weight="600">Offline-first, for real</text>
        <text x="870" y="426" fill="#0369a1" font-size="12" font-weight="700" fill-opacity="0.45">DESIGN NOTES</text>
        <text x="870" y="450" fill="#0f172a" font-size="16" font-weight="600" fill-opacity="0.45">Telling users they're offline</text>
      </g>
    </g>
  </g>
</svg>
